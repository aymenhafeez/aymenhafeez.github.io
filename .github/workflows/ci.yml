name: Check site

on:
  push:
    branches: [master, rewrite]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    name: Build, links and Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Markdown rendering
        run: npm test

      - name: Build and check site
        run: npm run check
