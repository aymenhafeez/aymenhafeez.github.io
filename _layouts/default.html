<!DOCTYPE html>
<html>
  <head>
    <title>{% if page.title %}[{{ page.title }}] – {% endif %}{{ site.name }}</title>

    {% include meta.html %}

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="{{ site.baseurl }}/feed.xml" />
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap');
    </style>

    <!-- TUI-themed Jekyll site -->
  </head>

  <body>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <div class="site-info">
            <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.name | downcase }}</a></h1>
          </div>

          <nav>
            <a href="{{ site.baseurl }}/">blog</a>
            <a href="{{ site.baseurl }}/about">about</a>
            <a href="{{ site.baseurl }}/photos">photos</a>
            <!-- <a href="{{ site.baseurl }}/mail">newsletter</a> -->
          </nav>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          <div class="terminal-prompt">$</div> {% include svg-icons.html %}
        </footer>
      </div>
    </div>

    {% include analytics.html %}
  </body>
</html>
